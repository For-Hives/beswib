name: Build and Test

env:
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
  NEXT_PUBLIC_POCKETBASE_URL: ${{ secrets.NEXT_PUBLIC_POCKETBASE_URL }}
  POCKETBASE_TOKEN: ${{ secrets.POCKETBASE_TOKEN }}

# Pull requests, and main itself: a commit pushed straight to main that breaks
# the checks used to stay unseen and turn every later pull request red.
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - name: 'Install Node'
        uses: actions/setup-node@v7
        with:
          node-version: '26.x'
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.18.0
          run_install: |
            - recursive: true
              args: [--frozen-lockfile]
      - name: 'Typescript Check'
        run: pnpm tsc
      - name: 'Biome Checks'
        run: pnpm check
      - name: 'Run Tests'
        run: pnpm test:run
      - name: 'Build Project'
        run: pnpm build
