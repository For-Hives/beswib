name: Build and Test

env:
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
  NEXT_PUBLIC_POCKETBASE_URL: ${{ secrets.NEXT_PUBLIC_POCKETBASE_URL }}
  POCKETBASE_TOKEN: ${{ secrets.POCKETBASE_TOKEN }}
  NEXT_PUBLIC_PAYPAL_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_PAYPAL_CLIENT_ID }}
  PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
  PAYPAL_BN_CODE: ${{ secrets.PAYPAL_BN_CODE }}

# Pull requests, and main itself: a commit pushed straight to main that breaks
# the checks used to stay unseen and turn every later pull request red.
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - name: 'Install Node'
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.13.0
          run_install: |
            - recursive: true
              args: [--frozen-lockfile]
      - name: 'Typescript Check'
        run: pnpm tsc
      - name: 'Biome Checks'
        run: pnpm check
      - name: 'Run Tests'
        run: pnpm test:run
      - name: 'Build Project'
        run: pnpm build
