name: Build and Deploy on prod

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get the version from the tag
        id: get_tag_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Configure Git
        run: |
          git config --global user.email "action@beswib.com"
          git config --global user.name "Beswib"

      - name: Update package.json version
        run: |
          npm version ${GITHUB_REF#refs/tags/v} --no-git-tag-version
          git add package.json
          git commit -m "⬆️VERSION⬆️ ❇️${GITHUB_REF#refs/tags/v}❇️"

      - name: Push changes
        uses: ad-m/github-push-action@v1.3.0
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          branch: main
          force: true
      # Coolify 4.3+ only accepts POST on its deploy endpoint (a GET gets a 405).
      # --fail-with-body: a refused call fails the job instead of passing unseen.
      - name: Deploy to Coolify
        run: |
          curl --fail-with-body --request POST '${{ secrets.COOLIFY_WEBHOOK }}' --header 'Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}'
