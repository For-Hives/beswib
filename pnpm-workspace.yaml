# One package, no workspace: this file only holds pnpm settings.
# "packages" must stay: pnpm 9, which builds the deployments, refuses the file without it.
packages:
  - .

# pnpm 12 (the CI) stops on a dependency build script that is neither allowed nor refused.
# These two are refused on purpose, as pnpm 10 already did: esbuild's only checks its binary,
# core-js's only prints a message.
allowBuilds:
  core-js: false
  esbuild: false
